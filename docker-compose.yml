version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: stockflow-mysql
    restart: always
    environment:
      MYSQL_DATABASE: stockflow_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: ./stockflow-backend
      dockerfile: Dockerfile
    container_name: stockflow-backend-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/stockflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    depends_on:
      - mysql-db

  frontend:
    build:
      context: ./stockflow-frontend
      dockerfile: Dockerfile
    container_name: stockflow-frontend-app
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
