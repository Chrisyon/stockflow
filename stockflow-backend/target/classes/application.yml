server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: stockflow-backend
  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stockflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# JWT Security Configurations
app:
  jwt:
    secret: 9a4f2c8d7e1b5a3f6c8e0d2b4a6f8c1d3e5b7a9f2c4d6e8b0a2c4e6f8a1b3c5d
    expiration-milliseconds: 86400000 # 24 Hours

# OpenAPI / Swagger Documentation Config
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
